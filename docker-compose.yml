# Brings up the full stack: MongoDB -> FastAPI (ai-service) -> Node (server) -> React (client).
#
# Quick start:
#   1. cp .env.example .env   (at repo root) and fill in real secrets
#   2. docker compose up --build
#
# Services talk to each other over the internal "researchmind" network using
# their service names as hostnames (e.g. the server reaches Mongo at
# "mongodb://mongo:27017", and the AI service at "http://ai-service:8000").
# Only the client (80) and server (5000) ports are published to the host;
# ai-service and mongo stay internal-only, matching the "frontend never talks
# to FastAPI directly" requirement.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - researchmind
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      PORT: 8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env}
      ALLOWED_ORIGINS: http://server:5000,http://localhost:5000
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mistral}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-faiss}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: ai_service
    volumes:
      - ai_service_data:/app/data
      - ai_service_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - researchmind
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      MONGODB_URI: mongodb://mongo:27017/researchmind
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_AI_SERVICE_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - server_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - researchmind
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server
    networks:
      - researchmind

networks:
  researchmind:
    driver: bridge

volumes:
  mongo_data:
  ai_service_data:
  ai_service_logs:
  server_logs:
