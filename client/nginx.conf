server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed assets aggressively; index.html itself is never cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy API calls to the Node server container so the browser
    # only ever talks to this origin (avoids CORS, matches VITE_API_BASE_URL=/api
    # baked in at build time for the docker-compose deployment).
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA fallback - let React Router handle client-side paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
